<!DOCTYPE html>
<html>
    <head>
    <title>
    Login Into Your Account 
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>


        </style>
        <link rel="stylesheet" href="loginpage.css">
    </head>

<body class="body">
<div class="container-fluid">
    <h1 class="text">Log Into Your Account</h1>

    <form>
        <button class="button">
            Sign In
        </button><br><br>

        <label for="email" class="text"><strong>Enter Your Email</strong>:</label>
        <br>
        <input type="email" id="email" name="email"><br>
        <br>

        <label for="password" class="text"><strong>Enter Your Password</strong>:</label>
        <br>
        <input type="password" id="password" name="password"><br>
        <br>


        <button class="button">
            Submit
        </button>
        <br>
        <a href="" class="text">Forgot Password</a>
    </form>
</div>




</body>
</html>
