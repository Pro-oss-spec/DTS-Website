<!DOCTYPE html>
<html>
    <head>
    <title>
    Sign Up for Your Account 
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>


        </style>
        <link rel="stylesheet" href="loginpage.css">
    </head>
<body class="body">
<div class="container-fluid">
    <h1 class="text">Sign Up for Your Account</h1>

    <form>
        <label for="email" class="text"><strong>Enter Your Email</strong>:</label>
        <br>
        <input type="email" id="email" name="email"><br>
        <br>

        <label for="password" class="text"><strong>Create Your Password</strong>:</label>
        <br>
        <input type="password" id="password" name="password"><br>
        <br>

        <label for="confirm-password" class="text"><strong>Confirm Your Password</strong>:</label>
        <br>
        <input type="password" id="confirm-password" name="confirm-password"><br>
        <br>


        <button class="button">
            Sign Up
        </button>
        <br>
    </form>
</div>




</body>
</html>
